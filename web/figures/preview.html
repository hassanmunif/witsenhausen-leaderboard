<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Link preview image</title>
<!-- Source of web/figures/preview.png, the 1200 x 630 image shown when a link to the site is shared.
     Render it with python scripts/build_preview.py. It holds no numbers, so it does not go stale. -->
<style>
@font-face { font-family: "LM"; src: url("../vendor/latin-modern/LM-regular.woff2") format("woff2"); font-weight: 400; font-style: normal; }
@font-face { font-family: "LM"; src: url("../vendor/latin-modern/LM-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
@font-face { font-family: "LM"; src: url("../vendor/latin-modern/LM-bold.woff2") format("woff2"); font-weight: 700; font-style: normal; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #ffffff; }
body { font-family: "LM", serif; color: #111318; }
.frame { box-sizing: border-box; width: 1200px; height: 630px; padding: 52px 80px; display: flex; flex-direction: column; justify-content: space-between; }
.rule { border-top: 2.5px solid #111318; }
.thin { border-top: 1px solid #111318; margin-top: 5px; }
.thin.under { margin: 0 0 5px; }
.grid { display: grid; grid-template-columns: 1fr 400px; column-gap: 64px; align-items: center; }
h1 { font-size: 76px; font-weight: 700; line-height: 1.02; margin: 0 0 22px; letter-spacing: -0.5px; }
.tagline { font-size: 31px; font-style: italic; color: #3b404b; line-height: 1.3; margin: 0 0 34px; }
ul { list-style: none; margin: 0; padding: 0; font-size: 26px; color: #3b404b; }
li { display: flex; align-items: center; gap: 14px; margin: 0 0 10px; }
li i { width: 14px; height: 14px; border-radius: 50%; flex: none; }
svg { display: block; }
</style>
</head>
<body>
<div class="frame">
  <div><div class="rule"></div><div class="thin"></div></div>
  <div class="grid">
    <div>
      <h1>Witsenhausen<br>leaderboard</h1>
      <p class="tagline">Verified progress on a control problem open since 1968</p>
      <ul>
        <li><i style="background:#eb6834"></i>Controllers recomputed from their files</li>
        <li><i style="background:#2a78d6"></i>Costs claimed in papers</li>
        <li><i style="background:#006300"></i>Proven lower bounds</li>
      </ul>
    </div>
    <svg id="plot" width="400" height="400" viewBox="0 0 400 400" aria-hidden="true"></svg>
  </div>
  <div><div class="thin under"></div><div class="rule"></div></div>
</div>
<script>
/* The shape of the record controllers: odd sloped steps about 6.6 apart. A motif, not data. */
(function () {
  var NS = "http://www.w3.org/2000/svg", svg = document.getElementById("plot"), L = 30, S = 400;
  function X(v) { return (v + L) / (2 * L) * S; }
  function Y(v) { return S - (v + L) / (2 * L) * S; }
  function el(tag, a) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; }
  for (var g = -20; g <= 20; g += 10) {
    el("line", { x1: X(g), y1: 0, x2: X(g), y2: S, stroke: "#e3e5eb", "stroke-width": 1 });
    el("line", { x1: 0, y1: Y(g), x2: S, y2: Y(g), stroke: "#e3e5eb", "stroke-width": 1 });
  }
  el("rect", { x: 0.5, y: 0.5, width: S - 1, height: S - 1, fill: "none", stroke: "#111318", "stroke-width": 1 });
  el("line", { x1: X(-L), y1: Y(-L), x2: X(L), y2: Y(L), stroke: "#9aa0ae", "stroke-width": 1.4 });
  var cuts = [3.29, 9.96, 16.87, 24.17, 31], levels = [0, 6.54, 13.25, 20.31, 27.6], slope = 0.06;
  for (var i = 0; i < levels.length; i++) {
    var a = i ? cuts[i - 1] : -cuts[0], b = Math.min(cuts[i], L), mid = i ? (a + b) / 2 : 0;
    [1, -1].forEach(function (sg) {
      if (i === 0 && sg < 0) return;
      var x0 = sg * a, x1 = sg * b, y0 = sg * (levels[i] + slope * (a - mid)), y1 = sg * (levels[i] + slope * (b - mid));
      el("line", { x1: X(x0), y1: Y(y0), x2: X(x1), y2: Y(y1), stroke: "#eb6834", "stroke-width": 5, "stroke-linecap": "round" });
    });
  }
})();
</script>
</body>
</html>
