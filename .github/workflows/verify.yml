name: Verify submissions

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Evaluator and data tests
        run: python -m pytest -q
      - name: Score every submission
        run: python scripts/score_all.py
      - name: Build the site
        run: python scripts/build_site.py
      - name: Check the pages
        run: python scripts/check_site.py --strict
